
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>展示物認識・ORB特徴点マッチング</title>
  <script src="./opencv-3.0.0-standalone.js"></script>

  <style>
    body {
      margin: 0;
      padding: 10px;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    #video {
      display: block;
      width: 100%;
      max-height: 55vh;
      object-fit: contain;
      background: #222;
    }

    #message, #score, #status {
      padding: 6px;
    }

    #message {
      font-size: 20px;
      font-weight: bold;
    }

    #score {
      font-size: 18px;
    }

    #status {
      font-size: 14px;
    }

    .reference {
      display: none;
    }

    #matchCanvas {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 8px;
      background: #222;
    }

    .caption {
      font-size: 14px;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div id="message">準備中...</div>
  <div id="score">良好な対応点数：---</div>
  <div id="status">OpenCVを初期化しています</div>

  <video id="video" autoplay muted playsinline></video>

  <div class="caption">
    ORB対応点の可視化（左：基準画像、右：カメラ画像）
  </div>
  <canvas id="matchCanvas"></canvas>

  <!-- 基準画像10枚 -->
  <img class="reference" id="reference1" src="assets/reference1.png">
  <img class="reference" id="reference2" src="assets/reference2.png">
  <img class="reference" id="reference3" src="assets/reference3.png">
  <img class="reference" id="reference4" src="assets/reference4.png">
  <img class="reference" id="reference5" src="assets/reference5.png">
  <img class="reference" id="reference6" src="assets/reference6.png">
  <img class="reference" id="reference7" src="assets/reference7.png">
  <img class="reference" id="reference8" src="assets/reference8.png">
  <img class="reference" id="reference9" src="assets/reference9.png">
  <img class="reference" id="reference10" src="assets/reference10.png">

<script>
const video = document.getElementById("video");
const message = document.getElementById("message");
const scoreText = document.getElementById("score");
const statusText = document.getElementById("status");
const matchCanvas = document.getElementById("matchCanvas");
const matchCtx = matchCanvas.getContext("2d");

const images = Array.from(
  { length: 10 },
  (_, i) => document.getElementById("reference" + (i + 1))
);

let cvx;
let orb;
let matcher;
let references = [];
let busy = false;
let lastRun = 0;

function waitForImages() {
  return Promise.all(images.map((img, i) => {
    if (img.complete && img.naturalWidth > 0) {
      return Promise.resolve();
    }

    return new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = () => reject(
        new Error("基準画像" + (i + 1) + "を読み込めません")
      );
    });
  }));
}

// ORB特徴点の座標をJavaScript配列に保存する
  
function getKeypointCoordinates(keypoints) {
  const points = [];

  for (let i = 0; i < keypoints.size(); i++) {
    const kp = keypoints.get(i);

    // このOpenCV環境ではkp.delete()を呼び出さない
    points.push({
      x: kp.pt.x,
      y: kp.pt.y
    });
  }

  return points;
}


async function initialize(readyCV) {
  cvx = readyCV;

  try {
    orb = new cvx.ORB(1000);
    matcher = new cvx.BFMatcher(cvx.NORM_HAMMING, false);

    await waitForImages();
    prepareReferences();
    await startCamera();
  } catch (error) {
    console.error(error);
    statusText.textContent = "初期化エラー：" + error.message;
    message.textContent = "起動できませんでした";
  }
}

function prepareReferences() {
  references = images.map((img, index) => {
    const src = cvx.imread(img);
    const gray = new cvx.Mat();
    const keypoints = new cvx.KeyPointVector();
    const descriptors = new cvx.Mat();
    const mask = new cvx.Mat();

    try {
      cvx.cvtColor(src, gray, cvx.COLOR_RGBA2GRAY);
      orb.detectAndCompute(gray, mask, keypoints, descriptors);

      if (descriptors.empty() || descriptors.rows === 0) {
        throw new Error(
          "基準画像" + (index + 1) +
          "から特徴点を検出できません"
        );
      }

      const result = {
        descriptors: descriptors.clone(),
        points: getKeypointCoordinates(keypoints),
        width: img.naturalWidth,
        height: img.naturalHeight
      };

      console.log(
        "基準画像" + (index + 1) +
        "の特徴点数：" + result.points.length
      );

      return result;
    } finally {
      src.delete();
      gray.delete();
      keypoints.delete();
      descriptors.delete();
      mask.delete();
    }
  });

  statusText.textContent = "基準画像10枚の特徴量を準備しました";
}

async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    throw new Error(
      "カメラ機能が利用できません。HTTPSで開いてください"
    );
  }

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: "environment" } },
    audio: false
  });

  video.srcObject = stream;
  await video.play();

  message.textContent = "展示物をカメラに映してください";
  requestAnimationFrame(loop);
}

function loop(timestamp) {
  requestAnimationFrame(loop);

  if (
    busy ||
    video.readyState < 2 ||
    timestamp - lastRun < 500
  ) {
    return;
  }

  lastRun = timestamp;
  busy = true;

  try {
    recognize();
  } catch (error) {
    console.error(error);
    statusText.textContent = "認識エラー：" + error.message;
  } finally {
    busy = false;
  }
}

function recognize() {
  const cameraCanvas = document.createElement("canvas");
  cameraCanvas.width = video.videoWidth;
  cameraCanvas.height = video.videoHeight;

  cameraCanvas.getContext("2d").drawImage(
    video, 0, 0, cameraCanvas.width, cameraCanvas.height
  );

  const src = cvx.imread(cameraCanvas);
  const gray = new cvx.Mat();
  const keypoints = new cvx.KeyPointVector();
  const descriptors = new cvx.Mat();
  const mask = new cvx.Mat();

  let bestCount = 0;
  let bestIndex = -1;
  let bestPairs = [];

  try {
    cvx.cvtColor(src, gray, cvx.COLOR_RGBA2GRAY);
    orb.detectAndCompute(gray, mask, keypoints, descriptors);

    if (descriptors.empty() || descriptors.rows === 0) {
      scoreText.textContent = "良好な対応点数：0";
      message.textContent = "特徴点を検出できません";
      statusText.textContent = "照明やカメラの向きを変えてください";
      return;
    }

    // 現在のカメラ画像にある特徴点の座標を取得
    const cameraPoints = getKeypointCoordinates(keypoints);

    references.forEach((ref, index) => {
      const matches = new cvx.DMatchVectorVector();

      try {
        // queryIdx：カメラ画像側
        // trainIdx：基準画像側
        matcher.knnMatch(
          descriptors, ref.descriptors, matches, 2
        );

        let goodCount = 0;
        const goodPairs = [];

        for (let i = 0; i < matches.size(); i++) {
          const pair = matches.get(i);

          try {
            if (pair.size() >= 2) {
              const first = pair.get(0);
              const second = pair.get(1);

              try {
                // 良好な対応点を選ぶための比率条件
                if (first.distance < 0.75 * second.distance) {
                  goodCount++;

                  goodPairs.push({
                    cameraIndex: first.queryIdx,
                    referenceIndex: first.trainIdx
                  });
                }
              } finally {
                first.delete();
                second.delete();
              }
            }
          } finally {
            pair.delete();
          }
        }

        console.log(
          "基準画像" + (index + 1) +
          "の良好な対応点数：" + goodCount
        );

        if (goodCount > bestCount) {
          bestCount = goodCount;
          bestIndex = index;
          bestPairs = goodPairs;
        }
      } finally {
        matches.delete();
      }
    });

    scoreText.textContent = "良好な対応点数：" + bestCount;

    statusText.textContent = bestCount >= 20
      ? "照合完了"
      : "照合できません";

    message.textContent = bestCount >= 20
      ? "特徴点が一致しました"
      : "十分な一致を確認できません";

    // 最も対応点数が多かった基準画像を可視化
    if (bestIndex >= 0) {
      drawMatches(
        images[bestIndex],
        references[bestIndex],
        cameraCanvas,
        cameraPoints,
        bestPairs
      );
    } else {
      drawEmptyCanvas();
    }

  } finally {
    src.delete();
    gray.delete();
    keypoints.delete();
    descriptors.delete();
    mask.delete();
  }
}

// 基準画像とカメラ画像を横に並べ、対応点を線で結ぶ
function drawMatches(
  referenceImage,
  reference,
  cameraImage,
  cameraPoints,
  pairs
) {
  const refW = reference.width;
  const refH = reference.height;
  const camW = cameraImage.width;
  const camH = cameraImage.height;

  matchCanvas.width = refW + camW;
  matchCanvas.height = Math.max(refH, camH);

  matchCtx.clearRect(
    0, 0, matchCanvas.width, matchCanvas.height
  );

  matchCtx.fillStyle = "#222";
  matchCtx.fillRect(
    0, 0, matchCanvas.width, matchCanvas.height
  );

  matchCtx.drawImage(referenceImage, 0, 0, refW, refH);
  matchCtx.drawImage(cameraImage, refW, 0, camW, camH);

  // 対応点を線で結ぶ
  matchCtx.lineWidth = 1;

  pairs.forEach(pair => {
    const refPoint = reference.points[pair.referenceIndex];
    const camPoint = cameraPoints[pair.cameraIndex];

    if (!refPoint || !camPoint) return;

    matchCtx.beginPath();
    matchCtx.moveTo(refPoint.x, refPoint.y);
    matchCtx.lineTo(refW + camPoint.x, camPoint.y);
    matchCtx.strokeStyle = "rgba(0, 255, 100, 0.8)";
    matchCtx.stroke();
  });

  // 基準画像側の対応点を丸で表示
  pairs.forEach(pair => {
    const point = reference.points[pair.referenceIndex];
    if (!point) return;

    matchCtx.beginPath();
    matchCtx.arc(point.x, point.y, 4, 0, Math.PI * 2);
    matchCtx.fillStyle = "#ff4444";
    matchCtx.fill();
  });

  // カメラ画像側の対応点を丸で表示
  pairs.forEach(pair => {
    const point = cameraPoints[pair.cameraIndex];
    if (!point) return;

    matchCtx.beginPath();
    matchCtx.arc(
      refW + point.x, point.y, 4, 0, Math.PI * 2
    );
    matchCtx.fillStyle = "#ff4444";
    matchCtx.fill();
  });

  console.log(
    "表示中の基準画像：" + (bestReferenceNumber()) +
    "、描画した対応点数：" + pairs.length
  );
}

function bestReferenceNumber() {
  // 表示中の基準画像番号は認識処理側のbestIndexで管理
  return bestIndexForDisplay + 1;
}

let bestIndexForDisplay = 0;

function drawEmptyCanvas() {
  matchCanvas.width = 600;
  matchCanvas.height = 160;

  matchCtx.clearRect(
    0, 0, matchCanvas.width, matchCanvas.height
  );

  matchCtx.fillStyle = "#222";
  matchCtx.fillRect(
    0, 0, matchCanvas.width, matchCanvas.height
  );

  matchCtx.fillStyle = "white";
  matchCtx.font = "18px sans-serif";
  matchCtx.textAlign = "center";
  matchCtx.fillText(
    "対応点を表示できません",
    matchCanvas.width / 2,
    matchCanvas.height / 2
  );
}

cv.then(initialize).catch(error => {
  console.error(error);
  statusText.textContent = "OpenCVの初期化に失敗しました";
});
</script>
</body>
</html>
