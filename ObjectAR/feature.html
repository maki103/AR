
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>展示物認識・ORB特徴点マッチング</title>
  <script src="./opencv-3.0.0-standalone.js"></script>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }
    #video {
      display: block;
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
    }
    #message, #score, #status {
      padding: 8px;
    }
    #message { font-size: 20px; font-weight: bold; }
    #score { font-size: 18px; }
    #status { font-size: 14px; }
    .reference { display: none; }
  </style>
</head>
<body>
  <div id="message">準備中...</div>
  <div id="score">良好な対応点数：---</div>
  <div id="status">OpenCVを初期化しています</div>

  <video id="video" autoplay muted playsinline></video>

  <!-- 基準画像10枚 -->
  <img class="reference" id="reference1" src="assets/reference1.png">
  <img class="reference" id="reference2" src="assets/reference2.png">
  <img class="reference" id="reference3" src="assets/reference3.png">
  <img class="reference" id="reference4" src="assets/reference4.png">
  <img class="reference" id="reference5" src="assets/reference5.png">
  <img class="reference" id="reference6" src="assets/reference6.png">
  <img class="reference" id="reference7" src="assets/reference7.png">
  <img class="reference" id="reference8" src="assets/reference8.png">
  <img class="reference" id="reference9" src="assets/reference9.png">
  <img class="reference" id="reference10" src="assets/reference10.png">

<script>
const video = document.getElementById("video");
const message = document.getElementById("message");
const scoreText = document.getElementById("score");
const statusText = document.getElementById("status");

// 基準画像10枚を取得
const images = Array.from(
  { length: 10 },
  (_, i) => document.getElementById("reference" + (i + 1))
);

let cvx;
let orb;
let matcher;
let references = [];
let busy = false;
let lastRun = 0;

function waitForImages() {
  return Promise.all(images.map((img, i) => {
    if (img.complete && img.naturalWidth > 0) {
      return Promise.resolve();
    }

    return new Promise((resolve, reject) => {
      img.onload = () => resolve();
      img.onerror = () => reject(
        new Error("基準画像" + (i + 1) + "を読み込めません")
      );
    });
  }));
}

async function initialize(readyCV) {
  cvx = readyCV;

  try {
    orb = new cvx.ORB(1000);
    matcher = new cvx.BFMatcher(cvx.NORM_HAMMING, false);

    await waitForImages();
    prepareReferences();
    await startCamera();
  } catch (error) {
    console.error(error);
    statusText.textContent = "初期化エラー：" + error.message;
    message.textContent = "起動できませんでした";
  }
}

function prepareReferences() {
  references = images.map((img, index) => {
    const src = cvx.imread(img);
    const gray = new cvx.Mat();
    const keypoints = new cvx.KeyPointVector();
    const descriptors = new cvx.Mat();
    const mask = new cvx.Mat();

    try {
      cvx.cvtColor(src, gray, cvx.COLOR_RGBA2GRAY);
      orb.detectAndCompute(gray, mask, keypoints, descriptors);

      if (descriptors.empty() || descriptors.rows === 0) {
        throw new Error(
          "基準画像" + (index + 1) +
          "から特徴点を検出できません"
        );
      }

      const result = descriptors.clone();

      console.log(
        "基準画像" + (index + 1) +
        "の特徴点数：", result.rows
      );

      return result;
    } finally {
      src.delete();
      gray.delete();
      keypoints.delete();
      descriptors.delete();
      mask.delete();
    }
  });

  statusText.textContent =
    "基準画像10枚の特徴量を準備しました";
}

async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    throw new Error(
      "カメラ機能が利用できません。HTTPSで開いてください"
    );
  }

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: "environment" } },
    audio: false
  });

  video.srcObject = stream;
  await video.play();

  message.textContent = "展示物をカメラに映してください";
  requestAnimationFrame(loop);
}

function loop(timestamp) {
  requestAnimationFrame(loop);

  if (
    busy ||
    video.readyState < 2 ||
    timestamp - lastRun < 500
  ) {
    return;
  }

  lastRun = timestamp;
  busy = true;

  try {
    recognize();
  } catch (error) {
    console.error(error);
    statusText.textContent = "認識エラー：" + error.message;
  } finally {
    busy = false;
  }
}

function recognize() {
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);

  const src = cvx.imread(canvas);
  const gray = new cvx.Mat();
  const keypoints = new cvx.KeyPointVector();
  const descriptors = new cvx.Mat();
  const mask = new cvx.Mat();

  let bestCount = 0;
  let bestIndex = -1;

  try {
    cvx.cvtColor(src, gray, cvx.COLOR_RGBA2GRAY);
    orb.detectAndCompute(gray, mask, keypoints, descriptors);

    if (descriptors.empty() || descriptors.rows === 0) {
      scoreText.textContent = "良好な対応点数：0";
      message.textContent = "特徴点を検出できません";
      statusText.textContent =
        "照明やカメラの向きを変えてください";
      return;
    }

    references.forEach((ref, index) => {
      const matches = new cvx.DMatchVectorVector();

      try {
        matcher.knnMatch(descriptors, ref, matches, 2);

        let goodCount = 0;

        for (let i = 0; i < matches.size(); i++) {
          const pair = matches.get(i);

          try {
            if (pair.size() >= 2) {
              const first = pair.get(0);
              const second = pair.get(1);

              if (first.distance < 0.75 * second.distance) {
                goodCount++;
              }
            }
          } finally {
            pair.delete();
          }
        }

        console.log(
          "基準画像" + (index + 1) +
          "の良好な対応点数：", goodCount
        );

        if (goodCount > bestCount) {
          bestCount = goodCount;
          bestIndex = index;
        }
      } finally {
        matches.delete();
      }
    });

    scoreText.textContent =
      "良好な対応点数：" + bestCount;

    statusText.textContent = bestIndex < 0
      ? "基準画像：未一致"
      : "最も一致した基準画像：" + (bestIndex + 1);

    // 仮の判定値。実験結果を確認して調整します。
    message.textContent = bestCount >= 15
      ? "特徴点が一致しました"
      : "十分な一致を確認できません";

  } finally {
    src.delete();
    gray.delete();
    keypoints.delete();
    descriptors.delete();
    mask.delete();
  }
}

cv.then(initialize).catch(error => {
  console.error(error);
  statusText.textContent =
    "OpenCVの初期化に失敗しました";
});
</script>
</body>
</html>
