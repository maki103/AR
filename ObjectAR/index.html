<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>展示物認識</title>

  <!-- OpenCV.js -->
  <script async
          src="https://docs.opencv.org/4.x/opencv.js">
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      width: 90%;
      padding: 15px;

      background: rgba(0, 0, 0, 0.7);
      color: white;

      text-align: center;
      font-size: 20px;

      border-radius: 10px;
      z-index: 10;
    }
  </style>
</head>

<body>

  <!-- カメラ映像 -->
  <video id="video" autoplay playsinline></video>

  <!-- 状態表示 -->
  <div id="message">
    カメラを起動しています
  </div>

  <script>

    const video =
      document.getElementById("video");

    const message =
      document.getElementById("message");


    /* =========================
       カメラ起動
       ========================= */

    async function startCamera() {

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: {
                ideal: "environment"
              }
            },

            audio: false

          });


        video.srcObject = stream;


        message.innerText =
          "カメラ起動成功";


      } catch (error) {

        console.error(error);


        message.innerText =
          "カメラを起動できませんでした";

      }

    }


    /* =========================
       OpenCV読み込み確認
       ========================= */

    function checkOpenCV() {

      if (
        typeof cv !== "undefined" &&
        cv.Mat
      ) {

        console.log(
          "OpenCV.js 読み込み成功"
        );

      } else {

        console.log(
          "OpenCV.js 読み込み中..."
        );

        setTimeout(
          checkOpenCV,
          1000
        );

      }

    }


    /* =========================
       実行
       ========================= */

    startCamera();

    checkOpenCV();

  </script>

</body>
</html>
