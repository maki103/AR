<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>展示物認識</title>


  <!-- OpenCV.js -->
  <script src="../opencv.js"></script>


  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }


    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    #message {
      position: fixed;

      top: 20px;
      left: 50%;

      transform: translateX(-50%);

      width: 90%;

      padding: 15px;

      background: rgba(0, 0, 0, 0.7);

      color: white;

      text-align: center;

      font-size: 20px;

      border-radius: 10px;

      z-index: 10;
    }


    #score {
      position: fixed;

      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      padding: 10px 20px;

      background: rgba(0, 0, 0, 0.7);

      color: white;

      font-size: 18px;

      border-radius: 10px;

      z-index: 10;
    }

  </style>

</head>


<body>


  <!-- カメラ映像 -->

  <video id="video"
         autoplay
         muted
         playsinline>
  </video>


  <!-- 認識状態 -->

  <div id="message">
    起動しています
  </div>


  <!-- 一致度 -->

  <div id="score">
    準備中...
  </div>


<script>


/* =================================
   HTML要素
   ================================= */

const video =
  document.getElementById("video");

const message =
  document.getElementById("message");

const scoreText =
  document.getElementById("score");


/* =================================
   変数
   ================================= */

let referenceImage = null;

let recognitionStarted = false;

let recognitionTimer = null;


/* =================================
   カメラ起動
   ================================= */

async function startCamera() {

  try {

    message.innerText =
      "カメラを起動しています";


    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    console.log(
      "カメラストリーム取得成功"
    );


    /*
     * カメラ映像をvideoに設定
     */

    video.srcObject = stream;


    /*
     * 明示的に再生
     */

    try {

      await video.play();

      console.log(
        "video再生開始"
      );

    } catch (error) {

      console.error(
        "video.play()エラー:",
        error
      );

    }


    message.innerText =
      "カメラ起動成功";


    /*
     * カメラ映像の準備を監視
     */

    video.addEventListener(
      "loadeddata",
      checkCameraReady
    );


    video.addEventListener(
      "canplay",
      checkCameraReady
    );


    video.addEventListener(
      "playing",
      checkCameraReady
    );


  } catch (error) {

    console.error(
      "カメラエラー:",
      error
    );


    message.innerText =
      "カメラを起動できませんでした";


    scoreText.innerText =
      error.message;

  }

}


/* =================================
   カメラ準備確認
   ================================= */

function checkCameraReady() {

  console.log(
    "カメラ状態確認"
  );

  console.log(
    "readyState:",
    video.readyState
  );

  console.log(
    "videoWidth:",
    video.videoWidth
  );

  console.log(
    "videoHeight:",
    video.videoHeight
  );


  if (
    video.videoWidth > 0 &&
    video.videoHeight > 0
  ) {

    message.innerText =
      "カメラ映像準備完了";


    scoreText.innerText =
      "基準画像を読み込んでいます";


    startRecognition();


  }

}


/* =================================
   OpenCV.js確認
   ================================= */

function waitForOpenCV() {

  if (
    typeof cv !== "undefined" &&
    cv.Mat
  ) {

    console.log(
      "OpenCV.js読み込み成功"
    );


    message.innerText =
      "OpenCV.js読み込み成功";


    scoreText.innerText =
      "基準画像を読み込んでいます";


    loadReference();


  } else {

    console.log(
      "OpenCV.js読み込み待機中"
    );


    message.innerText =
      "OpenCV.js読み込み中";


    setTimeout(
      waitForOpenCV,
      500
    );

  }

}


/* =================================
   基準画像読み込み
   ================================= */

function loadReference() {

  const img =
    new Image();


  img.onload = function() {

    console.log(
      "reference.png読み込み成功"
    );


    referenceImage =
      img;


    message.innerText =
      "基準画像読み込み成功";


    scoreText.innerText =
      "カメラ映像を待っています";


    /*
     * カメラがすでに準備できていれば開始
     */

    checkCameraReady();

  };


  img.onerror = function(error) {

    console.error(
      "reference.png読み込み失敗",
      error
    );


    message.innerText =
      "reference.pngを読み込めません";


    scoreText.innerText =
      "assets/reference.pngを確認してください";

  };


  /*
   * PNGファイル
   */

  img.src =
    "assets/reference.png";

}


/* =================================
   認識開始
   ================================= */

function startRecognition() {

  /*
   * すでに開始している場合は何もしない
   */

  if (recognitionStarted) {

    return;

  }


  /*
   * 基準画像がない場合
   */

  if (!referenceImage) {

    return;

  }


  /*
   * カメラ映像サイズが取得できない場合
   */

  if (
    video.videoWidth <= 0 ||
    video.videoHeight <= 0
  ) {

    return;

  }


  recognitionStarted =
    true;


  console.log(
    "認識開始"
  );


  message.innerText =
    "展示物をカメラに映してください";


  scoreText.innerText =
    "認識準備完了";


  /*
   * 0.5秒ごとに認識
   */

  recognitionTimer =
    setInterval(
      recognizeObject,
      500
    );

}


/* =================================
   展示物認識
   ================================= */

function recognizeObject() {

  if (
    !referenceImage
  ) {

    return;

  }


  if (
    video.videoWidth <= 0 ||
    video.videoHeight <= 0
  ) {

    return;

  }


  try {


    /* =============================
       基準画像
       ============================= */

    const reference =
      cv.imread(referenceImage);


    const referenceGray =
      new cv.Mat();


    cv.cvtColor(
      reference,
      referenceGray,
      cv.COLOR_RGBA2GRAY
    );


    /* =============================
       カメラ画像
       ============================= */

    const canvas =
      document.createElement("canvas");


    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    const ctx =
      canvas.getContext("2d");


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const camera =
      cv.imread(canvas);


    const cameraGray =
      new cv.Mat();


    cv.cvtColor(
      camera,
      cameraGray,
      cv.COLOR_RGBA2GRAY
    );


    /* =============================
       基準画像を縮小
       ============================= */

    const template =
      new cv.Mat();


    const templateWidth =
      Math.floor(
        cameraGray.cols * 0.25
      );


    const templateHeight =
      Math.floor(
        referenceGray.rows *
        templateWidth /
        referenceGray.cols
      );


    /*
     * サイズ確認
     */

    if (
      templateWidth <= 0 ||
      templateHeight <= 0 ||
      templateWidth >= cameraGray.cols ||
      templateHeight >= cameraGray.rows
    ) {

      reference.delete();

      referenceGray.delete();

      camera.delete();

      cameraGray.delete();

      template.delete();

      return;

    }


    cv.resize(
      referenceGray,
      template,
      new cv.Size(
        templateWidth,
        templateHeight
      )
    );


    /* =============================
       テンプレートマッチング
       ============================= */

    const result =
      new cv.Mat();


    cv.matchTemplate(
      cameraGray,
      template,
      result,
      cv.TM_CCOEFF_NORMED
    );


    /* =============================
       最大一致度を取得
       ============================= */

    const minMax =
      cv.minMaxLoc(result);


    const maxScore =
      minMax.maxVal;


    console.log(
      "一致度:",
      maxScore.toFixed(2)
    );


    /* =============================
       認識判定
       ============================= */

    if (
      maxScore >= 0.70
    ) {

      message.innerText =
        "展示物を認識しました";

    } else {

      message.innerText =
        "展示物を認識できません";

    }


    scoreText.innerText =
      "一致度：" +
      maxScore.toFixed(2);


    /* =============================
       メモリ解放
       ============================= */

    reference.delete();

    referenceGray.delete();

    camera.delete();

    cameraGray.delete();

    template.delete();

    result.delete();


  } catch (error) {

    console.error(
      "認識エラー:",
      error
    );


    message.innerText =
      "認識処理でエラーが発生しました";


    scoreText.innerText =
      error.message;

  }

}


/* =================================
   実行
   ================================= */

startCamera();

waitForOpenCV();


</script>

</body>

</html>
