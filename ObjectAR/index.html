<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>展示物認識AR</title>

  <!-- OpenCV.js -->
  <script src="../opencv.js"></script>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    #video {
      width: 100%;
      height: auto;
      display: block;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 0;
      width: 100%;
      font-size: 24px;
      font-weight: bold;
      z-index: 10;
      text-shadow: 1px 1px 3px black;
    }

    #score {
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      font-size: 18px;
      z-index: 10;
      text-shadow: 1px 1px 3px black;
    }

    /* 基準画像は画面には表示しない */
    .reference {
      display: none;
    }
  </style>
</head>

<body>

  <div id="message">
    カメラを起動しています...
  </div>

  <div id="score">
    認識スコア：---
  </div>

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>


  <!-- =========================
       基準画像3枚
       ========================= -->

  <img
    id="reference1"
    class="reference"
    src="assets/reference1.png">

  <img
    id="reference2"
    class="reference"
    src="assets/reference2.png">

  <img
    id="reference3"
    class="reference"
    src="assets/reference3.png">


  <script>

    // =========================
    // 要素取得
    // =========================

    const video =
      document.getElementById("video");

    const message =
      document.getElementById("message");

    const scoreText =
      document.getElementById("score");


    const referenceImages = [

      document.getElementById("reference1"),

      document.getElementById("reference2"),

      document.getElementById("reference3")

    ];


    // 連続認識回数
    let recognitionCount = 0;


    // =========================
    // カメラ起動
    // =========================

    async function startCamera() {

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: {
                ideal: "environment"
              }
            },

            audio: false

          });


        video.srcObject = stream;


        await video.play();


        message.innerText =
          "カメラを起動しました";


        checkCamera();


      } catch (error) {

        console.error(error);

        message.innerText =
          "カメラを起動できません";

      }

    }


    // =========================
    // カメラ映像確認
    // =========================

    function checkCamera() {

      if (
        video.videoWidth > 0 &&
        video.videoHeight > 0
      ) {

        message.innerText =
          "展示物をカメラに映してください";


        waitForOpenCV();


      } else {

        setTimeout(
          checkCamera,
          200
        );

      }

    }


    // =========================
    // OpenCV確認
    // =========================

    function waitForOpenCV() {

      if (
        typeof cv !== "undefined" &&
        cv.Mat
      ) {

        console.log(
          "OpenCV.js loaded"
        );


        loadReferences();


      } else {

        setTimeout(
          waitForOpenCV,
          200
        );

      }

    }


    // =========================
    // 基準画像読み込み
    // =========================

    function loadReferences() {

      let loaded = 0;


      referenceImages.forEach(
        (img, index) => {


          function imageLoaded() {

            loaded++;


            console.log(
              "基準画像 " +
              (index + 1) +
              " 読み込み完了"
            );


            if (
              loaded ===
              referenceImages.length
            ) {

              console.log(
                "3枚すべて読み込み完了"
              );


              startRecognition();

            }

          }


          // すでに読み込まれている場合
          if (
            img.complete &&
            img.naturalWidth > 0
          ) {

            imageLoaded();


          } else {

            // これから読み込む場合
            img.onload =
              imageLoaded;


            img.onerror =
              function() {

                console.error(
                  "基準画像 " +
                  (index + 1) +
                  " の読み込みに失敗"
                );

              };

          }

        }
      );

    }


    // =========================
    // 認識開始
    // =========================

    function startRecognition() {

      console.log(
        "3枚の基準画像を使用して認識開始"
      );


      message.innerText =
        "展示物をカメラに映してください";


      setInterval(
        recognizeObject,
        500
      );

    }


    // =========================
    // 展示物認識
    // =========================

    function recognizeObject() {

      try {


        // -------------------------
        // Canvas作成
        // -------------------------

        const canvas =
          document.createElement("canvas");


        canvas.width =
          video.videoWidth;

        canvas.height =
          video.videoHeight;


        const ctx =
          canvas.getContext("2d");


        ctx.drawImage(

          video,

          0,
          0,

          canvas.width,
          canvas.height

        );


        // -------------------------
        // カメラ画像
        // -------------------------

        const camera =
          cv.imread(canvas);


        const cameraGray =
          new cv.Mat();


        cv.cvtColor(

          camera,

          cameraGray,

          cv.COLOR_RGBA2GRAY

        );


        // -------------------------
        // 最大スコア
        // -------------------------

        let maxScore = 0;


        // =========================
        // 3枚を順番に比較
        // =========================

        referenceImages.forEach(
          (referenceImage) => {


            // 基準画像
            const reference =
              cv.imread(referenceImage);


            // グレースケール
            const referenceGray =
              new cv.Mat();


            cv.cvtColor(

              reference,

              referenceGray,

              cv.COLOR_RGBA2GRAY

            );


            // -------------------------
            // 基準画像を縮小
            // -------------------------

            const targetWidth =
              Math.floor(
                camera.cols * 0.25
              );


            const targetHeight =
              Math.floor(

                referenceGray.rows *

                targetWidth /

                referenceGray.cols

              );


            const template =
              new cv.Mat();


            cv.resize(

              referenceGray,

              template,

              new cv.Size(

                targetWidth,

                targetHeight

              )

            );


            // -------------------------
            // サイズ確認
            // -------------------------

            if (

              template.cols <=
              cameraGray.cols &&

              template.rows <=
              cameraGray.rows

            ) {


              const result =
                new cv.Mat();


              // -------------------------
              // テンプレートマッチング
              // -------------------------

              cv.matchTemplate(

                cameraGray,

                template,

                result,

                cv.TM_CCOEFF_NORMED

              );


              const minMax =
                cv.minMaxLoc(result);


              // 一番高い値を保存
              if (
                minMax.maxVal >
                maxScore
              ) {

                maxScore =
                  minMax.maxVal;

              }


              result.delete();

            }


            // -------------------------
            // メモリ解放
            // -------------------------

            reference.delete();

            referenceGray.delete();

            template.delete();

          }
        );


        // =========================
        // スコア表示
        // =========================

        scoreText.innerText =

          "認識スコア：" +

          maxScore.toFixed(2);


        // =========================
        // 認識判定
        // =========================

        if (
          maxScore >= 0.45
        ) {


          recognitionCount++;


          if (
            recognitionCount >= 3
          ) {

            message.innerText =
              "展示物を認識しました";


          } else {

            message.innerText =
              "認識中...";

          }


        } else {


          recognitionCount = 0;


          message.innerText =
            "展示物を認識できません";

        }


        // -------------------------
        // カメラ画像解放
        // -------------------------

        camera.delete();

        cameraGray.delete();


      } catch (error) {

        console.error(
          "認識エラー：",
          error
        );

      }

    }


    // =========================
    // プログラム開始
    // =========================

    startCamera();

  </script>

</body>
</html>
