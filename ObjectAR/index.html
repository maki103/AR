<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>展示物認識</title>

  <!-- GitHub Pagesに置いたOpenCV.js -->
  <script src="../opencv.js"></script>

  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      width: 90%;
      padding: 15px;

      background: rgba(0, 0, 0, 0.7);
      color: white;

      text-align: center;
      font-size: 20px;

      border-radius: 10px;
      z-index: 10;
    }

    #score {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);

      padding: 10px 20px;

      background: rgba(0, 0, 0, 0.7);
      color: white;

      font-size: 18px;

      border-radius: 10px;
      z-index: 10;
    }

  </style>
</head>

<body>

  <video id="video"
         autoplay
         playsinline></video>

  <div id="message">
    カメラを起動しています
  </div>

  <div id="score">
    OpenCV.js 読み込み確認中...
  </div>


<script>

const video =
  document.getElementById("video");

const message =
  document.getElementById("message");

const scoreText =
  document.getElementById("score");


let referenceImage = null;
let recognitionStarted = false;


/* =================================
   カメラ起動
   ================================= */

async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    video.srcObject = stream;


    /*
     * カメラ映像の準備ができたら
     * 認識開始
     */

    video.addEventListener(
      "loadedmetadata",
      startRecognition
    );

    video.addEventListener(
      "canplay",
      startRecognition
    );


    message.innerText =
      "カメラ起動成功";


  } catch (error) {

    console.error(error);

    message.innerText =
      "カメラを起動できませんでした";

    scoreText.innerText =
      error.message;

  }

}


/* =================================
   OpenCV確認
   ================================= */

function waitForOpenCV() {

  if (
    typeof cv !== "undefined" &&
    cv.Mat
  ) {

    console.log(
      "OpenCV.js 読み込み成功"
    );

    message.innerText =
      "OpenCV.js 読み込み成功";

    scoreText.innerText =
      "基準画像を読み込んでいます";

    loadReference();

  } else {

    message.innerText =
      "OpenCV.js 読み込み中...";

    setTimeout(
      waitForOpenCV,
      500
    );

  }

}


/* =================================
   基準画像読み込み
   ================================= */

function loadReference() {

  const img =
    new Image();

  img.onload = function() {

    console.log(
      "reference.png 読み込み成功"
    );

    referenceImage = img;

    message.innerText =
      "基準画像読み込み成功";

    scoreText.innerText =
      "カメラ映像を待っています";

    startRecognition();

  };


  img.onerror = function() {

    console.error(
      "reference.png 読み込み失敗"
    );

    message.innerText =
      "reference.pngを読み込めません";

    scoreText.innerText =
      "assets/reference.pngを確認してください";

  };


  img.src =
    "assets/reference.png";

}


/* =================================
   認識開始
   ================================= */

function startRecognition() {

  if (recognitionStarted) {
    return;
  }


  if (!referenceImage) {
    return;
  }


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    return;

  }


  recognitionStarted = true;


  console.log(
    "カメラ映像準備完了"
  );

  console.log(
    "videoWidth:",
    video.videoWidth
  );

  console.log(
    "videoHeight:",
    video.videoHeight
  );


  message.innerText =
    "展示物をカメラに映してください";

  scoreText.innerText =
    "認識準備完了";


  /*
   * 0.5秒ごとに認識
   */

  setInterval(
    recognizeObject,
    500
  );

}


/* =================================
   展示物認識
   ================================= */

function recognizeObject() {

  if (
    !referenceImage ||
    !video.videoWidth ||
    !video.videoHeight
  ) {

    return;

  }


  try {

    /* =============================
       基準画像
       ============================= */

    const reference =
      cv.imread(referenceImage);


    const referenceGray =
      new cv.Mat();


    cv.cvtColor(
      reference,
      referenceGray,
      cv.COLOR_RGBA2GRAY
    );


    /* =============================
       カメラ画像
       ============================= */

    const canvas =
      document.createElement("canvas");


    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    const ctx =
      canvas.getContext("2d");


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const camera =
      cv.imread(canvas);


    const cameraGray =
      new cv.Mat();


    cv.cvtColor(
      camera,
      cameraGray,
      cv.COLOR_RGBA2GRAY
    );


    /* =============================
       基準画像を縮小
       ============================= */

    const template =
      new cv.Mat();


    const templateWidth =
      Math.floor(
        cameraGray.cols * 0.25
      );


    const templateHeight =
      Math.floor(
        referenceGray.rows *
        templateWidth /
        referenceGray.cols
      );


    if (
      templateWidth >= cameraGray.cols ||
      templateHeight >= cameraGray.rows
    ) {

      reference.delete();
      referenceGray.delete();
      camera.delete();
      cameraGray.delete();
      template.delete();

      return;

    }


    cv.resize(
      referenceGray,
      template,
      new cv.Size(
        templateWidth,
        templateHeight
      )
    );


    /* =============================
       テンプレートマッチング
       ============================= */

    const result =
      new cv.Mat();


    cv.matchTemplate(
      cameraGray,
      template,
      result,
      cv.TM_CCOEFF_NORMED
    );


    /* =============================
       一致度
       ============================= */

    const minMax =
      cv.minMaxLoc(result);


    const maxScore =
      minMax.maxVal;


    /* =============================
       認識判定
       ============================= */

    if (maxScore >= 0.70) {

      message.innerText =
        "展示物を認識しました";

    } else {

      message.innerText =
        "展示物を認識できません";

    }


    scoreText.innerText =
      "一致度：" +
      maxScore.toFixed(2);


    console.log(
      "一致度：",
      maxScore.toFixed(2)
    );


    /* =============================
       メモリ解放
       ============================= */

    reference.delete();
    referenceGray.delete();

    camera.delete();
    cameraGray.delete();

    template.delete();
    result.delete();


  } catch (error) {

    console.error(error);

    message.innerText =
      "認識処理でエラーが発生しました";

    scoreText.innerText =
      error.message;

  }

}


/* =================================
   実行
   ================================= */

startCamera();

waitForOpenCV();

</script>

</body>
</html>
