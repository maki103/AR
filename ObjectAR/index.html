<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>展示物認識</title>

  <!-- GitHub Pagesに置いたOpenCV.js -->
  <script src="../opencv.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      width: 90%;
      padding: 15px;

      background: rgba(0, 0, 0, 0.7);
      color: white;

      text-align: center;
      font-size: 20px;

      border-radius: 10px;
      z-index: 10;
    }

    #count {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);

      padding: 10px 20px;

      background: rgba(0, 0, 0, 0.7);
      color: white;

      font-size: 18px;

      border-radius: 10px;
      z-index: 10;
    }
  </style>
</head>

<body>

  <!-- カメラ映像 -->
  <video id="video"
         autoplay
         playsinline></video>

  <!-- 状態表示 -->
  <div id="message">
    起動しています
  </div>

  <!-- 特徴点数 -->
  <div id="count">
    認識準備中...
  </div>


<script>

const video =
  document.getElementById("video");

const message =
  document.getElementById("message");

const count =
  document.getElementById("count");


/* =========================
   カメラ起動
   ========================= */

async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "environment"
        },
        audio: false
      });

    video.srcObject = stream;

    message.innerText =
      "カメラ起動成功";

  } catch (error) {

    console.error(error);

    message.innerText =
      "カメラを起動できませんでした";

    count.innerText =
      error.message;

  }

}


/* =========================
   OpenCV確認
   ========================= */

function waitForOpenCV() {

  if (
    typeof cv !== "undefined" &&
    cv.Mat
  ) {

    message.innerText =
      "OpenCV.js 読み込み成功";

    count.innerText =
      "基準画像を読み込んでいます";

    loadReference();

  } else {

    message.innerText =
      "OpenCV.js 読み込み中...";

    setTimeout(
      waitForOpenCV,
      500
    );

  }

}


/* =========================
   基準画像を読み込む
   ========================= */

function loadReference() {

  const img =
    new Image();

  img.onload = function() {

    console.log(
      "reference.jpg 読み込み成功"
    );

    detectORB(img);

  };

  img.onerror = function() {

    console.error(
      "reference.jpg 読み込み失敗"
    );

    message.innerText =
      "reference.jpgを読み込めません";

    count.innerText =
      "画像ファイルを確認してください";

  };

  img.src =
    "assets/reference.jpg";

}


/* =========================
   ORBで特徴点を取得
   ========================= */

function detectORB(img) {

  try {

    /* 基準画像をOpenCV形式に変換 */
    const src =
      cv.imread(img);


    /* グレースケール化 */
    const gray =
      new cv.Mat();

    cv.cvtColor(
      src,
      gray,
      cv.COLOR_RGBA2GRAY
    );


    /* ORBを作成 */
    const orb =
      new cv.ORB_create(500);


    /* 特徴点 */
    const keypoints =
      new cv.KeyPointVector();


    /* 特徴量 */
    const descriptors =
      new cv.Mat();


    /* 特徴点と特徴量を取得 */
    orb.detectAndCompute(
      gray,
      new cv.Mat(),
      keypoints,
      descriptors
    );


    /* 特徴点数 */
    const featureCount =
      keypoints.size();


    console.log(
      "基準画像の特徴点数：",
      featureCount
    );


    message.innerText =
      "基準画像の特徴点取得成功";


    count.innerText =
      "基準画像の特徴点：" +
      featureCount;


    /* メモリ解放 */
    src.delete();
    gray.delete();
    keypoints.delete();
    descriptors.delete();


  } catch (error) {

    console.error(error);

    message.innerText =
      "ORB処理でエラーが発生しました";

    count.innerText =
      error.message;

  }

}


/* =========================
   実行
   ========================= */

startCamera();

waitForOpenCV();

</script>

</body>
</html>
