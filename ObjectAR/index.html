<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>展示物認識AR</title>

  <script src="../opencv.js"></script>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    #video {
      width: 100%;
      height: auto;
      display: block;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 0;
      width: 100%;
      font-size: 24px;
      font-weight: bold;
      z-index: 10;
    }

    #score {
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      font-size: 18px;
      z-index: 10;
    }

    #reference1,
    #reference2,
    #reference3 {
      display: none;
    }
  </style>
</head>

<body>

  <div id="message">カメラを起動しています...</div>
  <div id="score">認識スコア：---</div>

  <video id="video" autoplay muted playsinline></video>

  <!-- 基準画像 -->
  <img id="reference1" src="assets/reference1.png">
  <img id="reference2" src="assets/reference2.png">
  <img id="reference3" src="assets/reference3.png">

  <script>

    const video = document.getElementById("video");
    const message = document.getElementById("message");
    const scoreText = document.getElementById("score");

    const referenceImages = [
      document.getElementById("reference1"),
      document.getElementById("reference2"),
      document.getElementById("reference3")
    ];

    let recognitionCount = 0;

    // -----------------------------
    // カメラ起動
    // -----------------------------
    async function startCamera() {

      try {

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });

        video.srcObject = stream;

        await video.play();

        message.innerText = "カメラを起動しました";

        checkCamera();

      } catch (error) {

        console.error(error);

        message.innerText =
          "カメラを起動できません";

      }

    }


    // -----------------------------
    // カメラ映像確認
    // -----------------------------
    function checkCamera() {

      if (
        video.videoWidth > 0 &&
        video.videoHeight > 0
      ) {

        message.innerText =
          "展示物をカメラに映してください";

        waitForOpenCV();

      } else {

        setTimeout(checkCamera, 200);

      }

    }


    // -----------------------------
    // OpenCV確認
    // -----------------------------
    function waitForOpenCV() {

      if (
        typeof cv !== "undefined" &&
        cv.Mat
      ) {

        console.log("OpenCV.js loaded");

        loadReferences();

      } else {

        setTimeout(waitForOpenCV, 200);

      }

    }


    // -----------------------------
    // 基準画像読み込み確認
    // -----------------------------
    function loadReferences() {

      let loaded = 0;

      referenceImages.forEach((img, index) => {

        if (img.complete) {

          loaded++;

          if (loaded === 3) {
            startRecognition();
          }

        } else {

          img.onload = function() {

            loaded++;

            if (loaded === 3) {
              startRecognition();
            }

          };

        }

      });

    }


    // -----------------------------
    // 認識開始
    // -----------------------------
    function startRecognition() {

      console.log("3枚の基準画像を使用して認識開始");

      setInterval(
        recognizeObject,
        500
      );

    }


    // -----------------------------
    // 展示物認識
    // -----------------------------
    function recognizeObject() {

      try {

        // カメラ画像をCanvasへ
        const canvas =
          document.createElement("canvas");

        canvas.width =
          video.videoWidth;

        canvas.height =
          video.videoHeight;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );


        // カメラ画像
        const camera =
          cv.imread(canvas);

        const cameraGray =
          new cv.Mat();

        cv.cvtColor(
          camera,
          cameraGray,
          cv.COLOR_RGBA2GRAY
        );


        let maxScore = 0;


        // -----------------------------
        // 3枚の基準画像を比較
        // -----------------------------
        referenceImages.forEach(
          (referenceImage) => {

            const reference =
              cv.imread(referenceImage);

            const referenceGray =
              new cv.Mat();

            cv.cvtColor(
              reference,
              referenceGray,
              cv.COLOR_RGBA2GRAY
            );


            // 基準画像をカメラ幅の25%程度に縮小
            const targetWidth =
              Math.floor(
                camera.cols * 0.25
              );

            const targetHeight =
              Math.floor(
                referenceGray.rows *
                targetWidth /
                referenceGray.cols
              );

            const template =
              new cv.Mat();

            cv.resize(
              referenceGray,
              template,
              new cv.Size(
                targetWidth,
                targetHeight
              )
            );


            // テンプレートマッチング
            if (
              template.cols <= cameraGray.cols &&
              template.rows <= cameraGray.rows
            ) {

              const result =
                new cv.Mat();

              cv.matchTemplate(
                cameraGray,
                template,
                result,
                cv.TM_CCOEFF_NORMED
              );

              const minMax =
                cv.minMaxLoc(result);

              if (
                minMax.maxVal >
                maxScore
              ) {

                maxScore =
                  minMax.maxVal;

              }

              result.delete();

            }


            reference.delete();
            referenceGray.delete();
            template.delete();

          }
        );


        // -----------------------------
        // 結果表示
        // -----------------------------
        scoreText.innerText =
          "認識スコア：" +
          maxScore.toFixed(2);


        // 3回連続認識
        if (maxScore >= 0.45) {

          recognitionCount++;

          if (recognitionCount >= 3) {

            message.innerText =
              "展示物を認識しました";

          } else {

            message.innerText =
              "認識中...";

          }

        } else {

          recognitionCount = 0;

          message.innerText =
            "展示物を認識できません";

        }


        camera.delete();
        cameraGray.delete();

      } catch (error) {

        console.error(
          "認識エラー：",
          error
        );

      }

    }


    // -----------------------------
    // 開始
    // -----------------------------
    startCamera();

  </script>

</body>
</html>
