<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>展示物認識</title>

  <script src="../opencv.js"></script>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    #video {
      width: 100%;
      display: block;
    }

    #message {
      position: fixed;
      top: 15px;
      left: 0;
      width: 100%;
      font-size: 22px;
      font-weight: bold;
      z-index: 10;
      text-shadow: 1px 1px 3px black;
    }

    #score {
      position: fixed;
      top: 55px;
      left: 0;
      width: 100%;
      font-size: 18px;
      z-index: 10;
      text-shadow: 1px 1px 3px black;
    }

    #loadStatus {
      position: fixed;
      bottom: 15px;
      left: 0;
      width: 100%;
      font-size: 16px;
      z-index: 10;
      text-shadow: 1px 1px 3px black;
    }

    .reference {
      display: none;
    }
  </style>
</head>

<body>

  <div id="message">
    カメラを起動しています...
  </div>

  <div id="score">
    認識スコア：---
  </div>

  <div id="loadStatus">
    基準画像を確認しています...
  </div>

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>


  <!-- 基準画像 -->
  <img
    id="reference1"
    class="reference"
    src="assets/reference1.png">

  <img
    id="reference2"
    class="reference"
    src="assets/reference2.png">

  <img
    id="reference3"
    class="reference"
    src="assets/reference3.png">


  <script>

    const video =
      document.getElementById("video");

    const message =
      document.getElementById("message");

    const scoreText =
      document.getElementById("score");

    const loadStatus =
      document.getElementById("loadStatus");


    const referenceImages = [

      document.getElementById("reference1"),

      document.getElementById("reference2"),

      document.getElementById("reference3")

    ];


    let recognitionCount = 0;


    // ==================================
    // カメラ起動
    // ==================================

    async function startCamera() {

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: {
                ideal: "environment"
              }
            },

            audio: false

          });


        video.srcObject = stream;

        await video.play();


        message.innerText =
          "カメラを起動しました";


        checkCamera();


      } catch (error) {

        console.error(error);

        message.innerText =
          "カメラを起動できません";

      }

    }


    // ==================================
    // カメラ確認
    // ==================================

    function checkCamera() {

      if (
        video.videoWidth > 0 &&
        video.videoHeight > 0
      ) {

        message.innerText =
          "展示物をカメラに映してください";

        waitForOpenCV();

      } else {

        setTimeout(
          checkCamera,
          200
        );

      }

    }


    // ==================================
    // OpenCV確認
    // ==================================

    function waitForOpenCV() {

      if (
        typeof cv !== "undefined" &&
        cv.Mat
      ) {

        console.log(
          "OpenCV.js loaded"
        );

        loadReferences();

      } else {

        setTimeout(
          waitForOpenCV,
          200
        );

      }

    }


    // ==================================
    // 3枚の画像を確認
    // ==================================

    function loadReferences() {

      let loaded = 0;


      referenceImages.forEach(
        (img, index) => {

          function success() {

            loaded++;

            console.log(
              "reference" +
              (index + 1) +
              ".png OK"
            );

            loadStatus.innerText =
              "基準画像 " +
              loaded +
              " / 3 読み込み完了";


            if (
              loaded === 3
            ) {

              loadStatus.innerText =
                "3枚の基準画像を読み込みました";

              startRecognition();

            }

          }


          function failed() {

            console.error(
              "reference" +
              (index + 1) +
              ".png 読み込み失敗"
            );

            loadStatus.innerText =
              "reference" +
              (index + 1) +
              ".png が読み込めません";

          }


          if (
            img.complete &&
            img.naturalWidth > 0
          ) {

            success();

          } else {

            img.onload =
              success;

            img.onerror =
              failed;

          }

        }
      );

    }


    // ==================================
    // 認識開始
    // ==================================

    function startRecognition() {

      console.log(
        "認識開始"
      );


      message.innerText =
        "展示物をカメラに映してください";


      // 最初の1回をすぐ実行
      recognizeObject();


      // 0.5秒ごと
      setInterval(
        recognizeObject,
        500
      );

    }


    // ==================================
    // 展示物認識
    // ==================================

    function recognizeObject() {

      try {

        // ------------------------------
        // Canvas
        // ------------------------------

        const canvas =
          document.createElement("canvas");


        canvas.width =
          video.videoWidth;

        canvas.height =
          video.videoHeight;


        const ctx =
          canvas.getContext("2d");


        ctx.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );


        // ------------------------------
        // カメラ画像
        // ------------------------------

        const camera =
          cv.imread(canvas);


        const cameraGray =
          new cv.Mat();


        cv.cvtColor(
          camera,
          cameraGray,
          cv.COLOR_RGBA2GRAY
        );


        let maxScore = 0;


        // ------------------------------
        // 3枚を比較
        // ------------------------------

        referenceImages.forEach(
          (referenceImage) => {

            const reference =
              cv.imread(referenceImage);


            const referenceGray =
              new cv.Mat();


            cv.cvtColor(
              reference,
              referenceGray,
              cv.COLOR_RGBA2GRAY
            );


            // 基準画像の幅
            // カメラ画像の25%
            const targetWidth =
              Math.floor(
                camera.cols * 0.25
              );


            const targetHeight =
              Math.floor(

                referenceGray.rows *
                targetWidth /
                referenceGray.cols

              );


            const template =
              new cv.Mat();


            cv.resize(

              referenceGray,

              template,

              new cv.Size(
                targetWidth,
                targetHeight
              )

            );


            if (

              template.cols <=
              cameraGray.cols &&

              template.rows <=
              cameraGray.rows

            ) {

              const result =
                new cv.Mat();


              cv.matchTemplate(

                cameraGray,

                template,

                result,

                cv.TM_CCOEFF_NORMED

              );


              const minMax =
                cv.minMaxLoc(result);


              if (
                minMax.maxVal >
                maxScore
              ) {

                maxScore =
                  minMax.maxVal;

              }


              result.delete();

            }


            reference.delete();

            referenceGray.delete();

            template.delete();

          }
        );


        // ------------------------------
        // スコア表示
        // ------------------------------

        scoreText.innerText =
          "認識スコア：" +
          maxScore.toFixed(2);


        // ------------------------------
        // 判定
        // ------------------------------

        if (
          maxScore >= 0.45
        ) {

          recognitionCount++;


          if (
            recognitionCount >= 3
          ) {

            message.innerText =
              "展示物を認識しました";

          } else {

            message.innerText =
              "認識中...";

          }

        } else {

          recognitionCount = 0;

          message.innerText =
            "展示物を認識できません";

        }


        camera.delete();

        cameraGray.delete();


      } catch (error) {

        console.error(
          "認識エラー：",
          error
        );

      }

    }


    // ==================================
    // 開始
    // ==================================

    startCamera();

  </script>

</body>
</html>
