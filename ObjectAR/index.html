<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>展示物認識</title>

  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      width: 90%;
      padding: 15px;

      background: rgba(0, 0, 0, 0.7);
      color: white;

      text-align: center;
      font-size: 20px;

      border-radius: 10px;
      z-index: 10;
    }
  </style>
</head>

<body>

  <video id="video" autoplay playsinline></video>

  <div id="message">
    カメラを起動しています
  </div>

  <script>

  const video = document.getElementById("video");
  const message = document.getElementById("message");

  async function startCamera() {

    try {

      const stream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });

      video.srcObject = stream;

      message.innerText =
        "カメラ起動成功";

    } catch (error) {

      console.error(error);

      message.innerText =
        "カメラを起動できませんでした";

    }

  }


  function checkOpenCV() {

    if (typeof cv !== "undefined" && cv.Mat) {

      message.innerText =
        "OpenCV.js 読み込み成功";

      loadReferenceImage();

    } else {

      message.innerText =
        "OpenCV.js 読み込み中...";

      setTimeout(checkOpenCV, 500);

    }

  }


  function loadReferenceImage() {

    const img = new Image();

    img.onload = function() {

      try {

        const mat = cv.imread(img);

        const gray = new cv.Mat();

        cv.cvtColor(
          mat,
          gray,
          cv.COLOR_RGBA2GRAY
        );


        const orb =
          new cv.ORB_create(500);

        const keypoints =
          new cv.KeyPointVector();

        const descriptors =
          new cv.Mat();


        orb.detectAndCompute(
          gray,
          new cv.Mat(),
          keypoints,
          descriptors
        );


        message.innerText =
          "基準画像の読み込み成功";

        document.getElementById("count").innerText =
          "基準画像の特徴点：" +
          keypoints.size();


        mat.delete();
        gray.delete();
        keypoints.delete();
        descriptors.delete();

      } catch (error) {

        console.error(error);

        message.innerText =
          "特徴点の取得に失敗しました";

      }

    };


    img.onerror = function() {

      message.innerText =
        "reference.jpgを読み込めません";

    };


    img.src =
      "assets/reference.jpg";

  }


  startCamera();
  checkOpenCV();

  </script>
  
</body>
</html>
