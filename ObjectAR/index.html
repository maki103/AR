<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>展示物認識</title>

  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      width: 90%;
      padding: 15px;

      background: rgba(0, 0, 0, 0.7);
      color: white;

      text-align: center;
      font-size: 20px;

      border-radius: 10px;
      z-index: 10;
    }
  </style>
</head>

<body>

  <video id="video" autoplay playsinline></video>

  <div id="message">
    カメラを起動しています
  </div>

  <script>

  startCamera();

  setTimeout(function() {

    if (typeof cv !== "undefined") {

      message.innerText =
        "OpenCV.js 読み込み成功";

    } else {

      message.innerText =
        "OpenCV.js 読み込み失敗";

    }

  }, 5000);

</script>
</body>
</html>
